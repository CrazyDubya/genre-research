name: Python Tests

on:
  push:
    branches: [ main, develop, copilot/** ]
    paths:
      - 'novel-writer-harness/**/*.py'
      - 'novel-writer-harness/requirements.txt'
      - 'novel-writer-harness/pytest.ini'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'novel-writer-harness/**/*.py'
      - 'novel-writer-harness/requirements.txt'
      - 'novel-writer-harness/pytest.ini'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd novel-writer-harness
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests with pytest
      run: |
        cd novel-writer-harness
        pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-report=html -v

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./novel-writer-harness/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Archive coverage reports
      if: matrix.python-version == '3.11'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: novel-writer-harness/htmlcov/
